<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Once-ler</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: Georgia, serif; color: #fff; }
  canvas { display: block; }
  #crosshair { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: #fff; opacity: .7; }
  #hud { position: fixed; left: 16px; top: 14px; font-size: 16px; line-height: 1.5; text-shadow: 0 1px 3px #000; }
  #hud b { font-size: 20px; }
  #build { position: fixed; left: 16px; bottom: 14px; font-size: 14px; line-height: 1.6; text-shadow: 0 1px 3px #000; }
  #build .off { opacity: .45; }
  #build .sel { color: #ffe36b; }
  #caption { position: fixed; left: 0; right: 0; bottom: 16%; text-align: center; font-size: 24px; font-style: italic;
             text-shadow: 0 2px 6px #000; opacity: 0; transition: opacity .8s; padding: 0 10%; z-index: 5; }
  .bar { position: fixed; left: 0; right: 0; height: 0; background: #000; transition: height 1.2s; z-index: 4; }
  #barTop { top: 0; } #barBottom { bottom: 0; }
  body.cutscene .bar { height: 13%; }
  body.cutscene #hud, body.cutscene #build, body.cutscene #crosshair { opacity: 0; }
  #fade { position: fixed; inset: 0; background: #000; opacity: 0; transition: opacity 2s; pointer-events: none; z-index: 3; }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
           background: rgba(10, 30, 10, .25); text-shadow: 0 2px 8px #000; cursor: pointer; z-index: 10; text-align: center; }
  #start h1 { font-size: 64px; margin: 0 0 8px; font-weight: normal; }
  #start p { margin: 4px; font-size: 17px; opacity: .9; }
</style>
</head>
<body>
<div id="hud"></div>
<div id="build"></div>
<div id="crosshair"></div>
<div id="caption"></div>
<div id="barTop" class="bar"></div><div id="barBottom" class="bar"></div>
<div id="fade"></div>
<div id="start">
  <h1>The Once-ler</h1>
  <p>It is a beautiful morning. You have an axe.</p>
  <p style="margin-top:22px">Click to begin</p>
  <p style="font-size:14px;opacity:.7">WASD move · Shift run · Space jump · Click chop · 1 / 2 build · Q cancel</p>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
